name: Android validation

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, Room migration tests, document tests, lint and build variants
        run: ./gradlew test :data:test :documents:test lint assembleDebug assembleRelease
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-quality-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: warn

  instrumented:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Compose UI tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
            api-level: 37
          arch: x86_64
          profile: Nexus 6
          script: ./gradlew :app:connectedDebugAndroidTest :data:connectedDebugAndroidTest --console=plain
      - name: Run macrobenchmark and baseline profile checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
            api-level: 37
          arch: x86_64
          profile: Nexus 6
          script: ./gradlew :benchmark:connectedBenchmarkAndroidTest --console=plain
